<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CDAO Maximus APIs</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">M</div>
                <div class="brand-name">CDAO Maximus</div>
                <button id="btn-settings" class="icon-btn" title="API key settings">&#9881;</button>
            </div>
            <div class="sidebar-meta">
                <div id="meta-key">🔑 checking key…</div>
                <div id="meta-server">🖥 checking server…</div>
            </div>
            <div class="nav-section">APIs</div>
            <nav id="api-list" class="nav-list"></nav>
        </aside>

        <!-- Main -->
        <section class="main">
            <header class="topbar">
                <div id="page-title" class="page-title">Select an API</div>
                <div class="topbar-stats">
                    <span class="stat"><span id="dot-server" class="dot"></span>server <b id="stat-server">—</b></span>
                    <span class="sep">|</span>
                    <span class="stat"><span id="dot-key" class="dot"></span>key <b id="stat-key">—</b></span>
                    <span class="sep">|</span>
                    <span class="stat"><span id="dot-api" class="dot"></span>api <b id="stat-api">idle</b></span>
                </div>
            </header>

            <div id="view" class="view"></div>

            <section class="log-panel">
                <div class="log-header">
                    <span>Live log</span>
                    <div class="log-actions">
                        <label><input type="checkbox" id="log-autoscroll" checked> autoscroll</label>
                        <button id="log-clear" class="btn-ghost">clear</button>
                    </div>
                </div>
                <div id="log" class="log-body"></div>
            </section>
        </section>
    </div>

    <script src="js/log.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/apis.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
