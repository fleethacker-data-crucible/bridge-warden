# Full demo, about 4 minutes. t = real seconds after "Start Scenario".
# TIME_SCALE=10, so each real second is 10 sim seconds.
# Beats: crossing contact → engine fault (oscillation) → heavy weather (human approval) → compromised agent → recovery
name: full_demo
events:
  - t: 0
    phase: Calm transit
  - t: 5
    spawn_contact: { id: C-12, course: 0, speed: 12, collision_in_min: 12 }
  - t: 85
    phase: Engine fault
  - t: 86
    engine_fault: { severity: 1.0 }
  - t: 135
    phase: Heavy weather
  - t: 136
    weather: { wind_kts: 38, visibility_nm: 1.0, sea_state: 6 }
  - t: 175
    phase: Compromised agent
  - t: 176
    rogue_agent: { id: nrg-01 }
  - t: 215
    phase: Recovery
  - t: 216
    clear_fault: true
  - t: 217
    weather: { wind_kts: 12, visibility_nm: 8.0, sea_state: 2 }
