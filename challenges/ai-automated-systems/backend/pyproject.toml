[project]
name = "bridge-warden"
version = "0.1.0"
description = "Multi-agent governance and orchestration layer for maritime AI systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "websockets>=13.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
